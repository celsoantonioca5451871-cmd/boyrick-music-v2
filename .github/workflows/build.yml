name: build
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          cache-disabled: true
      - name: Listar ficheiros
        run: echo "::notice title=Ficheiros::$(find . -type f -not -path './.git/*' | sort | tr '\n' ' ')"
      - name: Run gradle assembleDebug
        run: |
          set -o pipefail
          gradle assembleDebug --console=plain 2>&1 | tee build.log
      - name: Mostrar erros
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong" -A4 build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
      - uses: actions/upload-artifact@v4
        with:
          name: BoyRickMusic-APK
          path: app/build/outputs/apk/debug/*.apk
